name: speak-with-data

x-acces: &acces
  S3_ENDPOINT: datalake:9000
  S3_ACCESS_KEY: admin
  S3_SECRET_KEY: admin12345
  S3_BUCKET: datalake
  DW_DSN: host=dw port=5432 dbname=dw user=dw password=dw
  PYTHONPATH: /opt/airflow/commun   # commun/graphiques.py, partagé par Jupyter et Airflow
  GRAPHS_DIR: /opt/airflow/graphs

services:
  # Data lake : stockage S3 (RustFS, compatible MinIO/AWS)
  datalake:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: admin
      RUSTFS_SECRET_KEY: admin12345
      RUSTFS_CONSOLE_ENABLE: "true"
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: [datalake:/data]

  # Dépose les 3 Parquet bruts de ../data dans s3://datalake/raw/ (une seule fois)
  datalake-init:
    image: amazon/aws-cli:latest
    depends_on: [datalake]
    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: admin12345
      AWS_DEFAULT_REGION: us-east-1
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    volumes: ["../data:/source:ro"]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        s3="aws --endpoint-url http://datalake:9000 s3"
        until $$s3 ls >/dev/null 2>&1; do echo "attente du data lake..."; sleep 2; done
        $$s3 mb s3://datalake 2>/dev/null || true
        depose() {
          if $$s3 ls "s3://datalake/raw/$$2" >/dev/null 2>&1; then echo "déjà présent : $$2"
          else echo "dépôt : $$2"; $$s3 cp "/source/$$1" "s3://datalake/raw/$$2" --only-show-errors; fi
        }
        depose "bodacc creation.parquet"     bodacc/creations.parquet
        depose "bodacc radiations.parquet"   bodacc/radiations.parquet
        depose "données financières.parquet" inpi/donnees_financieres.parquet

  # Data warehouse (base dw) + métadonnées Airflow (base airflow)
  dw:
    image: postgres:16
    environment:
      POSTGRES_USER: dw
      POSTGRES_PASSWORD: dw
      POSTGRES_DB: dw
    ports: ["127.0.0.1:5433:5432"]
    volumes:
      - ./sql:/docker-entrypoint-initdb.d:ro
      - dw:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "dw", "-d", "dw"]
      interval: 5s
      retries: 20

  # Orchestration : http://localhost:8080
  airflow:
    build: .
    image: speak-with-data
    command: standalone
    environment:
      <<: *acces
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://dw:dw@dw:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
      AIRFLOW_DB_DSN: host=dw port=5432 dbname=airflow user=dw password=dw   # lu par le DAG mesures
      MESURES_DIR: /opt/airflow/mesures
    ports: ["127.0.0.1:8080:8080"]
    volumes:
      - ./dags:/opt/airflow/dags
      - ./commun:/opt/airflow/commun:ro
      - ./graphs:/opt/airflow/graphs
      - ./rapport:/opt/airflow/rapport
      - ./mesures:/opt/airflow/mesures
    depends_on:
      dw: {condition: service_healthy}
      datalake-init: {condition: service_completed_successfully}

  # Prototypage : http://localhost:8888
  jupyter:
    build: .
    image: speak-with-data
    depends_on: [airflow]
    entrypoint: ["jupyter", "lab", "--ip=0.0.0.0", "--port=8888", "--no-browser",
                 "--IdentityProvider.token=", "--ServerApp.root_dir=/opt/airflow/notebooks"]
    environment: *acces
    ports: ["127.0.0.1:8888:8888"]
    volumes: [./notebooks:/opt/airflow/notebooks, ./commun:/opt/airflow/commun:ro]

  # Site de consultation des graphiques : http://localhost:5000
  site:
    build: ./site
    environment:
      GRAPHS_DIR: /graphs
    ports: ["127.0.0.1:5000:5000"]
    volumes: ["./graphs:/graphs:ro"]

volumes:
  datalake:
  dw:
